<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserve Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-black text-white flex items-center justify-center px-6">
  <div class="w-full max-w-md rounded-2xl border border-white/10 bg-white/5 p-8 space-y-5">
    <div>
      <p class="text-white/60 text-sm uppercase tracking-[0.2em]">Reserve</p>
      <h1 class="text-3xl font-semibold mt-2">Admin Login</h1>
    </div>

    <div class="space-y-2">
      <label for="password" class="block text-sm text-white/70">Password</label>
      <input
        id="password"
        type="password"
        class="w-full px-3 py-2 rounded-md bg-white text-black"
        placeholder="Enter admin password"
      />
    </div>

    <button
      id="btn-login"
      class="w-full px-4 py-2 rounded-md bg-[#D0842F] text-white hover:opacity-90 transition"
    >
      Log in
    </button>

    <p id="error-text" class="text-red-300 text-sm hidden"></p>
  </div>

  <script>
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("btn-login");
    const errorText = document.getElementById("error-text");

    async function login() {
      errorText.classList.add("hidden");
      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            password: passwordInput.value,
          }),
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          errorText.textContent = data.error || "Login failed.";
          errorText.classList.remove("hidden");
          loginBtn.disabled = false;
          loginBtn.textContent = "Log in";
          return;
        }

        window.location.href = "/admin/";
      } catch (error) {
        errorText.textContent = "Something went wrong.";
        errorText.classList.remove("hidden");
        loginBtn.disabled = false;
        loginBtn.textContent = "Log in";
      }
    }

    loginBtn.addEventListener("click", login);
    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
